<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="やること">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>やること</title>
<style>
  :root {
    --text: #fff;
    --muted: rgba(255,255,255,.62);
    --accent: #5ee7ff;
    --todo: 255,122,217;
    --doing: 255,200,87;
    --done: 94,231,255;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,.20), rgba(255,255,255,.06));
    --glass-border: rgba(255,255,255,.28);
    --vvh: 100dvh;
    --vvtop: 0px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #050816; }
  html, body { height: 100%; margin: 0; overflow: hidden; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -2;
    background-color: #050816; background-image: var(--bg, url("bg.jpg")); background-size: cover; background-position: center; background-repeat: no-repeat; }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(to bottom, rgba(5,8,22,.45), rgba(5,8,22,.25) 40%, rgba(5,8,22,.68)); }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  [hidden] { display: none !important; }

  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(255,255,255,.08), 0 10px 34px rgba(0,0,0,.35);
  }

  .app { height: 100dvh; max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .02em; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  .ver { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hbtns { display: flex; gap: 10px; }
  .icon-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn .badge { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; display: none; }
  #bell.on .badge { display: block; background: var(--accent); box-shadow: 0 0 10px rgba(94,231,255,.9); }
  #syncBtn[data-s="ok"] .badge { display: block; background: #7dffb0; box-shadow: 0 0 10px rgba(125,255,176,.9); }
  #syncBtn[data-s="busy"] .badge { display: block; background: #ffd98a; box-shadow: 0 0 10px rgba(255,217,138,.9); animation: blink 1s ease-in-out infinite; }
  #syncBtn[data-s="error"] .badge { display: block; background: #ff7b7b; box-shadow: 0 0 10px rgba(255,123,123,.9); }
  @keyframes blink { 50% { opacity: .25; } }

  form#form { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 20px; border-radius: 999px; }
  input[type=text], input[type=url], input[type=datetime-local], textarea { font-family: inherit; color: #fff; color-scheme: dark; }
  #input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font-size: 17px; }
  #input::placeholder { color: var(--muted); }
  #add { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; color: #04101c;
    background: linear-gradient(135deg, var(--accent), #8fb4ff); box-shadow: 0 0 18px rgba(94,231,255,.55);
    font-size: 26px; line-height: 1; font-weight: 700; transition: transform .15s, opacity .15s; }
  #add:active { transform: scale(.9); }
  #add:disabled { opacity: .35; box-shadow: none; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 5px; border-radius: 999px; }
  .tab { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted); font-size: 14px; font-weight: 700; transition: background .2s, color .2s; }
  .tab .dot, .mv .dot, .seg .dot, .pane-head .dot { width: 9px; height: 9px; border-radius: 50%; background: rgb(var(--c)); box-shadow: 0 0 8px rgba(var(--c), .8); flex: none; }
  .tab .count, .pane-head .count { font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.16); }
  .tab.active { background: rgba(255,255,255,.22); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  .drop-hot { outline: 2px solid rgb(var(--c)); outline-offset: -2px; background: rgba(var(--c), .28) !important; }

  .board { flex: 1; min-height: 0; display: flex; margin: 0 -16px; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
  .board::-webkit-scrollbar { display: none; }
  .pane { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 48px); }
  .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; margin-bottom: 14px; }
  .pane-head h2 { display: none; margin: 0; align-items: center; gap: 9px; font-size: 17px; }
  .clear-done { margin-left: auto; font-size: 13px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--glass-border); background: rgba(255,255,255,.1); }

  .stack { display: flex; flex-direction: column; gap: 16px; }
  .empty { text-align: center; color: var(--muted); margin: 44px 0 0; font-size: 15px; }

  .note { --c: var(--todo); position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: start;
    padding: 16px 8px 12px 14px; border-radius: 20px; transform: rotate(var(--rot, 0deg));
    background: linear-gradient(150deg, rgba(var(--c), .36), rgba(var(--c), .10) 72%);
    border: 1px solid rgba(var(--c), .6);
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 12px 28px rgba(0,0,0,.38);
    animation: pop .25s ease-out; }
  .note[data-stage="doing"] { --c: var(--doing); }
  .note[data-stage="done"] { --c: var(--done); }
  .note::before { content: ""; position: absolute; top: -7px; left: 50%; width: 56px; height: 15px; margin-left: -28px; border-radius: 3px;
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.32); transform: rotate(-2deg); pointer-events: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98) rotate(var(--rot, 0deg)); } }

  .check { width: 28px; height: 28px; margin-top: 2px; flex: none; border-radius: 50%; padding: 0; border: 2px solid rgba(255,255,255,.8);
    background: transparent; display: grid; place-items: center; transition: all .2s; }
  .check svg { width: 16px; height: 16px; stroke: #04101c; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0; transform: scale(.4); transition: all .2s; }
  .note[data-stage="done"] .check { background: rgb(var(--done)); border-color: rgb(var(--done)); box-shadow: 0 0 14px rgba(var(--done), .7); }
  .note[data-stage="done"] .check svg { opacity: 1; transform: none; }

  .note { cursor: grab; -webkit-user-select: none; user-select: none; }
  .body { min-width: 0; padding: 2px 0 6px; outline-offset: 4px; }
  .note button { cursor: pointer; }
  .note .grip { cursor: grab; }
  .title { font-size: 17px; font-weight: 650; line-height: 1.38; word-break: break-word; }
  .note[data-stage="done"] .title { color: var(--muted); text-decoration: line-through; }
  .memo { margin-top: 4px; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.78); white-space: pre-line; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-variant-numeric: tabular-nums; padding: 3px 10px 3px 8px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }
  .chip svg { width: 13px; height: 13px; }
  .chip.late { background: rgba(255,92,92,.3); border-color: rgba(255,140,140,.7); }

  .grip { width: 34px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: var(--muted);
    display: grid; place-items: center; touch-action: none; }
  .grip svg { width: 18px; height: 18px; }
  .moves { grid-column: 1 / -1; display: flex; gap: 8px; margin: 4px 6px 0 0; }
  .mv { flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 700;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.26); background: rgba(255,255,255,.1); transition: transform .12s, background .2s; }
  .mv:active { transform: scale(.96); background: rgba(255,255,255,.2); }
  .note.lifting { opacity: .22; }
  .ghost { position: fixed; left: 0; top: 0; z-index: 100; margin: 0; pointer-events: none; animation: none; will-change: transform;
    box-shadow: 0 24px 54px rgba(0,0,0,.6); }
  body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }

  /* シート（編集・設定） */
  .sheet-wrap { position: fixed; left: 0; right: 0; top: var(--vvtop); height: var(--vvh); z-index: 50; display: none;
    align-items: flex-end; justify-content: center; background: rgba(2,4,14,.58); }
  .sheet-wrap.open { display: flex; }
  .sheet { --c: var(--todo); width: 100%; max-width: 580px; max-height: 94%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px 18px calc(env(safe-area-inset-bottom) + 24px); border-radius: 28px 28px 0 0;
    background: linear-gradient(160deg, rgba(44,52,100,.82), rgba(14,18,46,.9));
    -webkit-backdrop-filter: blur(34px) saturate(180%); backdrop-filter: blur(34px) saturate(180%);
    border: 1px solid rgba(255,255,255,.25); border-bottom: 0; animation: slide .25s ease-out; }
  @keyframes slide { from { transform: translateY(40px); opacity: 0; } }
  .grab { width: 42px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); margin: 2px auto 12px; }
  .sheet-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .sheet-top h3 { margin: 0; flex: 1; font-size: 20px; }
  .btn { min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.12); font-size: 14px; font-weight: 700; }
  .btn:active { transform: scale(.97); }
  .btn.primary { color: #04101c; border: 0; background: linear-gradient(135deg, var(--accent), #8fb4ff); box-shadow: 0 0 16px rgba(94,231,255,.4); }
  .btn.danger { color: #ffb0b0; border-color: rgba(255,120,120,.5); }
  .btn:disabled { opacity: .4; }
  .f-input, .f-area { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.09);
    font-size: 16px; outline: 0; }
  .f-input:focus, .f-area:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(94,231,255,.2); }
  .f-input.big { font-size: 19px; font-weight: 650; flex: 1; min-width: 0; }
  .f-area { min-height: 88px; resize: vertical; line-height: 1.5; }
  .block { margin-top: 16px; }
  .label { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin: 0 0 7px 2px; font-weight: 700; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); }
  .seg button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 2px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 700; }
  .seg button.active { background: rgba(var(--c), .38); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row.tight { margin-top: 10px; }
  .qbtn { padding: 8px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.1); font-size: 13px; font-weight: 600; }
  .hint { margin: 8px 2px 0; font-size: 13px; line-height: 1.55; color: var(--muted); }
  .hint button { padding: 0; border: 0; background: none; color: var(--accent); font-size: 13px; text-decoration: underline; }
  .memo-block { margin-top: 10px; padding: 10px 12px 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); }
  .memo-block.cur { border-color: rgba(var(--mc), .85); background: rgba(var(--mc), .12); }
  .memo-block .label { display: flex; align-items: center; gap: 7px; }
  .memo-block .dot { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--mc)); }
  .status { display: grid; gap: 8px; margin-top: 6px; }
  .status div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border-radius: 14px; background: rgba(255,255,255,.07); font-size: 14px; }
  .status b { font-weight: 700; text-align: right; }
  .ok { color: #7dffb0; } .ng { color: #ffb0b0; } .warn { color: #ffd98a; }
  .sec-title { margin: 26px 2px 0; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.14); font-size: 16px; font-weight: 800; }
  .sec-title:first-of-type { margin-top: 4px; border-top: 0; padding-top: 0; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.55; padding: 12px 14px; border-radius: 14px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); word-break: break-all; -webkit-user-select: all; user-select: all; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .swatch { position: relative; height: 76px; padding: 0; border-radius: 16px; border: 2px solid rgba(255,255,255,.22); background-size: cover; background-position: center;
    display: flex; align-items: flex-end; justify-content: flex-start; overflow: hidden; }
  .swatch span { width: 100%; padding: 14px 8px 5px; font-size: 12px; font-weight: 700; text-align: left; background: linear-gradient(to top, rgba(0,0,0,.65), transparent); }
  .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(94,231,255,.28); }
  .sheet-ver { text-align: center; margin: 22px 0 0; font-size: 12px; color: var(--muted); }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translateX(-50%) translateY(20px); opacity: 0;
    z-index: 80; width: max-content; max-width: min(92vw, 440px); padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; text-align: center;
    pointer-events: none; transition: opacity .25s, transform .25s; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (min-width: 900px) {
    .tabs { display: none; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 18px; margin: 0; overflow: visible; }
    .pane { overflow-y: auto; padding: 16px 14px 40px; border-radius: 26px; background: rgba(5,8,22,.34); border: 1px solid rgba(255,255,255,.12); scroll-snap-align: none; }
    .pane-head h2 { display: flex; }
    .sheet-wrap { align-items: center; }
    .sheet { border-radius: 28px; border-bottom: 1px solid rgba(255,255,255,.25); max-height: 90%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>やること</h1><span class="ver" id="ver"></span></div>
    <div class="hbtns">
      <button id="bgBtn" class="icon-btn glass" type="button" aria-label="背景を変える">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3L15 13l5 4.5"/></svg>
      </button>
      <button id="syncBtn" class="icon-btn glass" type="button" data-s="off" aria-label="同期の設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 .5 9.5H7z"/></svg>
        <span class="badge"></span>
      </button>
      <button id="bell" class="icon-btn glass" type="button" aria-label="通知の設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 3.5 1.2 5 2 6H4c.8-1 2-2.5 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <span class="badge"></span>
      </button>
    </div>
  </header>

  <form id="form" class="glass" autocomplete="off">
    <input id="input" type="text" placeholder="思いついたらすぐ入力" enterkeyhint="done" aria-label="やることを入力">
    <button id="add" type="submit" aria-label="追加" disabled>+</button>
  </form>

  <nav id="tabs" class="tabs glass" aria-label="段階"></nav>
  <main id="board" class="board"></main>
</div>

<div id="sheetWrap" class="sheet-wrap"><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast glass" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const VERSION = "3.1";
  const KEY1 = "quick_todo_items_v1";   // ver 1.x のデータ（消さずに残す）
  const KEY2 = "quick_todo_v2";         // ver 2.0 以降の付箋（3.0 で更新時刻などを追加）
  const KEY_API = "qt_api";
  const KEY_SYNC = "qt_sync";
  const KEY_PUSHREG = "qt_pushreg";
  const DAY = 86400000;
  const STAGES = [
    { key: "todo", label: "未着手", empty: "未着手の付箋はありません" },
    { key: "doing", label: "実行中", empty: "実行中の付箋はありません" },
    { key: "done", label: "完了", empty: "完了した付箋はありません" },
  ];
  const LABEL = Object.fromEntries(STAGES.map((s) => [s.key, s.label]));
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const pad = (n) => String(n).padStart(2, "0");
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

  const ICON = {
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 3.5 1.2 5 2 6H4c.8-1 2-2.5 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>',
    memo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>',
  };

  /* ---------- データ ----------
     付箋 = { id, title, stage, notes:{todo,doing,done}, alarm, back, ts(並び順), u(最後に編集した時刻), d(削除した印), sy(サーバーへ送った u) } */
  function normalize(o) {
    const stage = STAGES.some((s) => s.key === o.stage) ? o.stage : "todo";
    const n = o.notes && typeof o.notes === "object" ? o.notes : {};
    const d = o.d ? 1 : 0;
    const ts = Number.isFinite(o.ts) ? o.ts : Date.now();
    return {
      id: String(o.id || uid()),
      title: d ? "" : String(o.title || "").slice(0, 200),
      stage,
      notes: d ? { todo: "", doing: "", done: "" } : { todo: String(n.todo || ""), doing: String(n.doing || ""), done: String(n.done || "") },
      alarm: !d && Number.isFinite(o.alarm) && stage !== "done" ? o.alarm : null,
      back: o.back === "doing" ? "doing" : "todo",
      ts,
      u: Number.isFinite(o.u) && o.u > 0 ? o.u : ts,
      d,
      sy: Number.isFinite(o.sy) ? o.sy : 0,
    };
  }

  async function joinSync(text) {

    if (isIOS && !standalone()) st3.append(statusRow("通知", "ホーム画面に追加したアプリで使えます", "warn")[0]);
    else if (!pushSupported()) st3.append(statusRow("通知", "このブラウザは非対応", "ng")[0]);
    else st3.append(statusRow("通知の許可", { granted: "許可済み", denied: "拒否されています", default: "未設定" }[push.perm] || push.perm, push.perm === "granted" ? "ok" : push.perm === "denied" ? "ng" : "warn")[0]);
    st3.append(statusRow("同期", sync.key && api ? "オン" : "オフ", sync.key && api ? "ok" : "warn")[0]);
    st3.append(statusRow("アプリを閉じているとき", push.active ? "通知が届きます" : "通知されません", push.active ? "ok" : "warn")[0]);
    b3.append(st3);
    const act = el("div", "row"); act.style.marginTop = "12px";
    const on = el("button", "btn primary", push.active ? "通知を再設定" : "通知をオンにする"); on.type = "button";
    on.addEventListener("click", run(on, enablePush));
    act.append(on);
    if (push.active) {
      const t = el("button", "btn", "テスト通知"); t.type = "button";
      t.addEventListener("click", run(t, async () => { await testPush(); return "テスト通知を送りました"; }));
      const off = el("button", "btn danger", "オフにする"); off.type = "button";
      off.addEventListener("click", run(off, async () => { await disablePush(); return "通知をオフにしました"; }));
      act.append(t, off);
    }
    b3.append(act);
    b3.append(el("p", "hint", sync.key ? "アラームの時間になると、同期しているすべての端末に通知が届きます。" : "通知を使うには、先に上の「同期」をオンにしてください。"));
    sheet.append(b3);

    sheet.append(el("p", "sheet-ver", "やること ver " + VERSION));
    updateSyncRows();
    if (keepScroll) sheet.scrollTop = prevTop;
  }
  $("bell").addEventListener("click", () => openSettings("notify"));
  $("syncBtn").addEventListener("click", () => openSettings("sync"));
  $("bgBtn").addEventListener("click", () => openSettings("bg"));

  /* ---------- 起動 ---------- */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(() => refreshPush()).catch(() => {}));
    navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.type === "open" && e.data.id) openNote(e.data.id); });
  }
  render();
  setActive(0);
  refreshPush();
  if (sync.key) scheduleSync(200);
  if (location.hash.startsWith("#note=")) openNote(decodeURIComponent(location.hash.slice(6)));
  if (location.hash.startsWith("#join=")) {
    const c = location.hash.slice(6);
    history.replaceState(null, "", location.pathname + location.search);
    if (!sync.key) { openSettings("sync"); const f = $("f-code"); if (f) f.value = c; toast("「参加する」を押してください", 4000); }
  }
  if (loaded.migrated) toast("ver " + VERSION + ": 以前のデータを未着手に移しました", 4500);
})();
</script>
</body>
</html>
