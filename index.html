<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="やること">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>やること</title>
<style>
  :root {
    --text: #fff;
    --muted: rgba(255,255,255,.55);
    --accent: #5ee7ff;
    --accent2: #c06bff;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,.20), rgba(255,255,255,.06));
    --glass-border: rgba(255,255,255,.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #050816; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Hiragino Sans", sans-serif; }

  /* 背景（iOSでfixed背景が崩れるので擬似要素で固定） */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background: #050816 url("bg.jpg") center / cover no-repeat;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(to bottom, rgba(5,8,22,.35), rgba(5,8,22,.15) 40%, rgba(5,8,22,.55));
  }

  .app {
    max-width: 560px; margin: 0 auto; min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px);
  }

  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(255,255,255,.08),
                0 10px 34px rgba(0,0,0,.35);
  }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: .02em;
       text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  #clear { display: none; color: var(--text); font-size: 14px; padding: 8px 14px; border-radius: 999px;
           border: 1px solid var(--glass-border); }
  #clear.show { display: block; }

  form { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 20px;
         border-radius: 999px; margin-bottom: 18px; }
  input[type=text] { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
         color: var(--text); font-size: 17px; /* 16px以上でiOSの自動ズームを防ぐ */
         font-family: inherit; }
  input::placeholder { color: var(--muted); }
  #add { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; color: #04101c;
         background: linear-gradient(135deg, var(--accent), #8fb4ff);
         box-shadow: 0 0 18px rgba(94,231,255,.55); font-size: 26px; line-height: 1; font-weight: 700;
         transition: transform .15s, opacity .15s; }
  #add:active { transform: scale(.9); }
  #add:disabled { opacity: .35; box-shadow: none; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li { display: flex; align-items: center; gap: 14px; padding: 14px 10px 14px 16px; border-radius: 22px;
       animation: pop .25s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }

  .check { width: 28px; height: 28px; flex: none; border-radius: 50%; padding: 0;
           border: 2px solid rgba(255,255,255,.75); background: transparent;
           display: grid; place-items: center; transition: all .2s; }
  .check svg { width: 16px; height: 16px; stroke: #04101c; stroke-width: 3.2; fill: none;
               stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.4); transition: all .2s; }
  li.done .check { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(94,231,255,.7); }
  li.done .check svg { opacity: 1; transform: none; }

  .title { flex: 1; min-width: 0; font-size: 17px; line-height: 1.4; word-break: break-word; }
  li.done .title { color: var(--muted); text-decoration: line-through; }

  .del { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent;
         color: var(--muted); font-size: 20px; }
  .del:active { background: rgba(255,255,255,.15); }

  .empty { text-align: center; color: var(--muted); margin-top: 48px; font-size: 16px; }
  button { font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>やること</h1>
    <button id="clear" class="glass" type="button">完了を削除</button>
  </header>

  <form id="form" class="glass" autocomplete="off">
    <input id="input" type="text" placeholder="思いついたらすぐ入力" enterkeyhint="done" aria-label="やることを入力">
    <button id="add" type="submit" aria-label="追加" disabled>+</button>
  </form>

  <ul id="list"></ul>
  <p id="empty" class="empty">やることはありません ✨</p>
</div>

<script>
(() => {
  const KEY = "quick_todo_items_v1";
  const $ = (id) => document.getElementById(id);
  const form = $("form"), input = $("input"), add = $("add"),
        list = $("list"), empty = $("empty"), clearBtn = $("clear");

  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function render() {
    const sorted = [...items.filter(i => !i.done), ...items.filter(i => i.done)];
    list.replaceChildren();
    for (const item of sorted) {
      const li = document.createElement("li");
      li.className = "glass" + (item.done ? " done" : "");

      const check = document.createElement("button");
      check.className = "check";
      check.type = "button";
      check.setAttribute("aria-label", item.done ? "未完了に戻す" : "完了にする");
      check.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      check.addEventListener("click", () => {
        item.done = !item.done;
        if (item.done && navigator.vibrate) navigator.vibrate(10);
        save(); render();
      });

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = item.title;
      title.addEventListener("click", () => check.click());

      const del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "×";
      del.setAttribute("aria-label", "削除");
      del.addEventListener("click", () => {
        items = items.filter(i => i.id !== item.id);
        save(); render();
      });

      li.append(check, title, del);
      list.append(li);
    }
    empty.style.display = items.length ? "none" : "block";
    clearBtn.classList.toggle("show", items.some(i => i.done));
  }

  input.addEventListener("input", () => { add.disabled = !input.value.trim(); });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    items.unshift({ id: uid(), title: t, done: false });
    input.value = "";
    add.disabled = true;
    save(); render();
    input.focus();               // 続けて入力できるようにキーボードを残す
  });

  clearBtn.addEventListener("click", () => {
    items = items.filter(i => !i.done);
    save(); render();
  });

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
